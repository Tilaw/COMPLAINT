<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Taslim Alwataniah</title>
  <meta name="description" content="Secure authentication gate for administrators.">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <!-- Brand Logo and Intro -->
    <div class="auth-brand">
      <div class="brand-logo">TA</div>
      <h1 class="auth-title">Admin Access</h1>
      <p class="auth-subtitle">Taslim Incident Management</p>
    </div>

    <!-- Glassmorphic Form Card -->
    <div class="auth-card">
      <h2 style="font-size: 1.25rem; margin-bottom: 1.5rem; text-align: center;">Sign In to Dashboard</h2>

      <!-- Auth Error Notification banner -->
      <div id="auth-alert" class="auth-alert" style="display: none;"></div>

      <form id="auth-form" onsubmit="handleAuthSubmit(event)" novalidate>

        <div class="form-group">
          <label class="form-label" for="user-email">Admin Email Address *</label>
          <input type="email" id="user-email" class="form-input" placeholder="e.g. admin@taslim.com" required>
          <div class="error-message">Please enter a valid email address.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="user-password">Password *</label>
          <input type="password" id="user-password" class="form-input" placeholder="••••••••" required>
          <div class="error-message">Password is required.</div>
        </div>

        <button type="submit" id="auth-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          Secure Login
        </button>
        
        <div style="text-align: center; margin-top: 1rem;">
          <a href="index" style="font-size: 0.85rem; color: var(--text-secondary);">Return to Home Page</a>
        </div>
      </form>
    </div>

    <!-- Change Password Form (Hidden by default) -->
    <div class="auth-card" id="password-change-card" style="display: none;">
      <h2 style="font-size: 1.25rem; margin-bottom: 1.5rem; text-align: center; color: var(--accent);">Action Required: Change Password</h2>
      <p style="text-align: center; font-size: 0.85rem; margin-bottom: 1rem;">For security reasons, you must change your default password before accessing the system.</p>
      
      <div id="pwd-alert" class="auth-alert" style="display: none;"></div>

      <form id="pwd-form" onsubmit="handlePasswordChange(event)" novalidate>
        <div class="form-group">
          <label class="form-label" for="new-password">New Password *</label>
          <input type="password" id="new-password" class="form-input" placeholder="Enter new strong password" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm Password *</label>
          <input type="password" id="confirm-password" class="form-input" placeholder="Repeat password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          Update & Continue
        </button>
      </form>
    </div>
  </div>

  <!-- Script for Auth Page Logic -->
  <script>
    let tempUsername = '';
    let tempPassword = '';

    document.addEventListener("DOMContentLoaded", () => {
      // Clear current session just in case
      localStorage.removeItem('taslim_currentUser');
    });

    async function handleAuthSubmit(event) {
      event.preventDefault();
      
      const emailInput = document.getElementById('user-email');
      const passInput = document.getElementById('user-password');
      const authAlert = document.getElementById('auth-alert');
      const submitBtn = document.getElementById('auth-submit-btn');

      if (!emailInput.value.trim() || !passInput.value) {
        authAlert.className = "auth-alert error-theme";
        authAlert.textContent = "Please fill in both fields.";
        authAlert.style.display = 'block';
        return;
      }

      const username = emailInput.value.trim().toLowerCase();
      const password = passInput.value;
      
      submitBtn.textContent = "Authenticating...";
      submitBtn.disabled = true;

      try {
        const res = await fetch('auth.php?action=login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await res.json();
        
        if (res.ok && data.success) {
          if (data.status === 'REQUIRE_PASSWORD_CHANGE') {
            tempUsername = username;
            tempPassword = password;
            // Hide login form and show change password form
            const forms = document.querySelectorAll('.auth-card');
            forms[0].style.display = 'none';
            document.getElementById('password-change-card').style.display = 'block';
          } else {
            localStorage.setItem('taslim_currentUser', JSON.stringify({ username }));
            window.location.href = 'dashboard';
          }
        } else {
          authAlert.className = "auth-alert error-theme";
          authAlert.textContent = data.error || "Invalid credentials.";
          authAlert.style.display = 'block';
        }
      } catch (e) {
        console.error(e);
        authAlert.className = "auth-alert error-theme";
        authAlert.textContent = "Network error. Server unreachable.";
        authAlert.style.display = 'block';
      } finally {
        submitBtn.textContent = "Secure Login";
        submitBtn.disabled = false;
      }
    }

    async function handlePasswordChange(event) {
      event.preventDefault();
      const newPwd = document.getElementById('new-password').value;
      const confirmPwd = document.getElementById('confirm-password').value;
      const pwdAlert = document.getElementById('pwd-alert');
      const btn = event.target.querySelector('button[type="submit"]');
      
      if (newPwd !== confirmPwd) {
        pwdAlert.className = "auth-alert error-theme";
        pwdAlert.textContent = "Passwords do not match.";
        pwdAlert.style.display = 'block';
        return;
      }
      
      if (newPwd.length < 6) {
        pwdAlert.className = "auth-alert error-theme";
        pwdAlert.textContent = "Password must be at least 6 characters.";
        pwdAlert.style.display = 'block';
        return;
      }
      
      btn.textContent = "Updating...";
      btn.disabled = true;

      try {
        const res = await fetch('auth.php?action=change_password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            username: tempUsername, 
            old_password: tempPassword, 
            new_password: newPwd 
          })
        });
        
        const data = await res.json();
        
        if (res.ok && data.success) {
          localStorage.setItem('taslim_currentUser', JSON.stringify({ username: tempUsername }));
          window.location.href = 'dashboard';
        } else {
          pwdAlert.className = "auth-alert error-theme";
          pwdAlert.textContent = data.error || "Failed to update password.";
          pwdAlert.style.display = 'block';
        }
      } catch (e) {
        pwdAlert.className = "auth-alert error-theme";
        pwdAlert.textContent = "Network error. Server unreachable.";
        pwdAlert.style.display = 'block';
      } finally {
        btn.textContent = "Update & Continue";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
